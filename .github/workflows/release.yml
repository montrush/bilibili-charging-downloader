name: Release 安装包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BBDOWN_VERSION: '1.6.3'
  BBDOWN_DATE: '20240814'

jobs:
  # ================= Windows: Setup.exe + 便携zip =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        shell: bash
        run: |
          echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          # 版本号注入后端, 应用内"检查更新"以它为准
          echo "__version__ = '${GITHUB_REF_NAME#v}'" > server/version.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: 构建前端
        working-directory: web
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装Python依赖+PyInstaller
        run: pip install -r server/requirements.txt pyinstaller

      - name: 下载 BBDown (win-x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/nilaoda/BBDown/releases/download/${{ env.BBDOWN_VERSION }}/BBDown_${{ env.BBDOWN_VERSION }}_${{ env.BBDOWN_DATE }}_win-x64.zip" -OutFile "$env:TEMP\bbdown.zip"
          Expand-Archive "$env:TEMP\bbdown.zip" -DestinationPath vendor -Force
          Get-ChildItem vendor

      - name: 下载 ffmpeg (gyan essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName vendor\ffmpeg.exe
          Copy-Item (Get-ChildItem "$env:TEMP\ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName vendor\ffprobe.exe

      - name: PyInstaller 打包
        run: pyinstaller packaging/bili_downloader.spec --noconfirm --distpath dist --workpath build

      - name: "冒烟: exe 启动检查"
        shell: pwsh
        run: |
          # BILI_PORT 跳过启动时的交互选端口(隐藏窗口无人可输入)
          $env:BILI_PORT = '8000'
          $p = Start-Process "dist\BiliDownloader\BiliDownloader.exe" -PassThru -WindowStyle Hidden `
               -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            if ($p.HasExited) { Write-Host "exe 提前退出, ExitCode=$($p.ExitCode)"; break }
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 2; $ok = $true; break } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            Write-Host "=== smoke-out ==="; Get-Content smoke-out.txt -ErrorAction SilentlyContinue
            Write-Host "=== smoke-err ==="; Get-Content smoke-err.txt -ErrorAction SilentlyContinue
            throw "exe 冒烟失败: /api/health 不通"
          }
          Write-Host "冒烟通过"

      - name: 便携版 zip
        shell: pwsh
        run: Compress-Archive -Path dist\BiliDownloader -DestinationPath "dist\BiliDownloader-portable-${{ env.VER }}-win-x64.zip"

      - name: Inno Setup 安装向导
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\setup.iss /DAppVersion=${{ env.VER }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/installer/*.exe
            dist/*portable*.zip

  # ================= Linux: .deb + tar.gz =================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        run: |
          echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          # 版本号注入后端, 应用内"检查更新"以它为准
          echo "__version__ = '${GITHUB_REF_NAME#v}'" > server/version.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: 构建前端
        working-directory: web
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装Python依赖+PyInstaller
        run: pip install -r server/requirements.txt pyinstaller

      - name: 下载 BBDown (linux-x64)
        run: |
          mkdir -p vendor
          curl -fL -o /tmp/bbdown.zip "https://github.com/nilaoda/BBDown/releases/download/${BBDOWN_VERSION}/BBDown_${BBDOWN_VERSION}_${BBDOWN_DATE}_linux-x64.zip"
          unzip -o /tmp/bbdown.zip -d vendor
          chmod +x vendor/BBDown
          ls -la vendor

      - name: 下载 ffmpeg (BtbN GitHub构建)
        run: |
          curl -fL -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe vendor/
          chmod +x vendor/ffmpeg vendor/ffprobe

      - name: PyInstaller 打包
        run: pyinstaller packaging/bili_downloader.spec --noconfirm --distpath dist --workpath build

      - name: "冒烟: 二进制启动检查"
        run: |
          # BILI_PORT 跳过启动时的交互选端口
          export BILI_PORT=8000
          ./dist/bili-downloader/bili-downloader &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then ok=1; break; fi
          done
          kill $PID 2>/dev/null || true
          [ "$ok" = "1" ] || { echo "冒烟失败: /api/health 不通"; exit 1; }
          echo "冒烟通过"

      - name: tar.gz 包
        run: tar -czf "dist/bili-downloader_${VER}_linux-x64.tar.gz" -C dist bili-downloader

      - name: 构建 .deb
        run: |
          PKG=dist/debroot
          mkdir -p $PKG/DEBIAN $PKG/opt
          cp -r dist/bili-downloader $PKG/opt/bili-downloader
          sed "s/__VERSION__/${VER}/" packaging/linux/DEBIAN/control > $PKG/DEBIAN/control
          cp packaging/linux/DEBIAN/postinst packaging/linux/DEBIAN/prerm $PKG/DEBIAN/
          chmod 755 $PKG/DEBIAN/postinst $PKG/DEBIAN/prerm
          dpkg-deb --build $PKG "dist/bili-downloader_${VER}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  # ================= 汇总发 Release =================
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -la artifacts/

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # upload-artifact多路径时保留dist/下相对结构(installer/子目录), glob不递归目录, 故需两行
          files: |
            artifacts/*
            artifacts/installer/*.exe
          generate_release_notes: true

  # ================= 同步Gitee(国内更新通道) =================
  # 代码+tag推送到Gitee镜像仓, 创建同名Release并上传Windows安装包(76MB<100MB附件上限;
  # 其余产物>100MB传不了, 国内Linux用户走加速镜像). token存repo secret GITEE_TOKEN
  sync-gitee:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - name: 推送master+tag到Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -o pipefail
          git config user.email "ci@github-actions"
          git config user.name "github-actions"
          URL="https://houplus:${GITEE_TOKEN}@gitee.com/houplus/bilibili-charging-downloader.git"
          # 坑1: tag事件的checkout是detached HEAD, 本地没有master分支 -> 用origin/master
          # 坑2: master不加+: 发版期间master若有新提交, Gitee已更新时非快进跳过, 不强推回滚
          # 坑3: 管道会吞exit code, 必须pipefail; 但非快进/已存在属正常场景, 显式容忍
          OUT=$(git push "$URL" "refs/remotes/origin/master:refs/heads/master" 2>&1) && echo "$OUT" | sed "s/${GITEE_TOKEN}/***/g" || {
            echo "$OUT" | sed "s/${GITEE_TOKEN}/***/g"
            echo "$OUT" | grep -qE "non-fast-forward|fetch first|up.to.date|rejected" \
              && echo "⚠️ master非快进(Gitee侧已更新), 跳过不影响Release" || exit 1
          }
          git push "$URL" "+${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>&1 | sed "s/${GITEE_TOKEN}/***/g" || echo "⚠️ tag推送失败/已存在, Release不受影响"

      - name: 创建Gitee Release并上传安装包
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/houplus/bilibili-charging-downloader"
          EXE=$(ls artifacts/installer/*-Setup-*.exe | head -1)
          echo "安装包: $EXE ($(du -m "$EXE" | cut -f1)MB)"
          # tag已有Release(重跑场景)则复用其id
          RID=$(curl -sf -X POST "$API/releases" \
                -d "access_token=${GITEE_TOKEN}" \
                -d "tag_name=${GITHUB_REF_NAME}" \
                -d "name=${GITHUB_REF_NAME}" \
                -d "body=自动同步自 GitHub Release ${GITHUB_REF_NAME} (完整4产物见GitHub)" \
                -d "target_commitish=master" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null) \
            || RID=$(curl -sf "$API/releases/tags/${GITHUB_REF_NAME}?access_token=${GITEE_TOKEN}" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Gitee release id: $RID"
          curl -sf -X POST "$API/releases/$RID/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${EXE}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Gitee附件已传:', d.get('name'), d.get('size'))"

